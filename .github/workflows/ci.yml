name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    # Every test needs a database, not just the API ones: the autouse
    # `clean_database` fixture in tests/conftest.py truncates the test
    # database before each test. Without a server, each test instead waits
    # out psycopg_pool's 30-second timeout and errors -- 192 tests, an hour
    # and a half, all red.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: emmio_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    # conftest.py hardcodes `postgresql:///emmio_test` so that a test run can
    # never be pointed at a real database. That DSN names no host, so libpq
    # fills one in from these -- which reaches the service container above
    # without the test suite having to trust an environment variable.
    env:
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: postgres

    steps:
    - uses: actions/checkout@v2
    - name: Set up Python 3.12
      uses: actions/setup-python@v2
      with:
        python-version: "3.12"
    # TODO(enzet): Uncomment this section when we want to test audio playback
    # using GitHub Actions. For now it seems too resource-intensive. We should
    # probably create another test configuration that will not run on every
    # commit.
    # name: Install system dependencies
    # run: |
    #   sudo apt-get update
    #   sudo apt-get install -y libmpv-dev
    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e .[dev,api]
    - name: Check formatting with Ruff
      run: |
        ruff format --check emmio/ tests/
    - name: Lint with Ruff
      run: |
        ruff check emmio/ tests/
    - name: Check types with ty
      run: |
        ty check emmio/ tests/
    # Also the fail-fast gate for the database: if the service is not
    # reachable this fails in seconds, instead of every test discovering it
    # one 30-second pool timeout at a time.
    - name: Create the test database schema
      run: |
        psql -v ON_ERROR_STOP=1 -q -f scripts/schema.sql emmio_test
    # `tests/test_api.py` is excluded: it drives the whole FastAPI surface
    # against a real database and takes too long to run on every push. Run it
    # locally (`pytest tests/test_api.py`) before touching `emmio/api/`.
    - name: Test with pytest
      run: |
        pytest -v --ignore=tests/test_api.py
