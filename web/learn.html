<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Emmio — Learn</title>
        <link rel="icon" href="/doc/icon.svg" type="image/svg+xml" />
        <script src="theme.js"></script>
        <link rel="stylesheet" href="base.css" />
        <link rel="stylesheet" href="fancy.css" />
        <script src="app.js" defer></script>
    </head>
    <body data-page="learn">
        <header>
            <a href="index" class="home">
                <img src="/doc/logo.svg" alt="Emmio" class="logo-corner" />
            </a>
            <nav>
                <a href="courses">← Courses</a>
            </nav>
            <a href="profile" class="profile-link">Profile</a>
        </header>
        <main>
            <h1 id="learn-heading">Learn</h1>

            <!-- New-word check: does the user already know this word? Shown
                 only when the course has an `ask_lexicon` and the word is new
                 there; the answer is recorded in that lexicon. -->
            <section id="ask-box" aria-labelledby="ask-heading" hidden>
                <h2 id="ask-heading">Do you already know this word?</h2>
                <p id="ask-word" class="word"></p>
                <div id="ask-answers">
                    <button type="button" id="ask-know" data-key="y">
                        I know it <kbd>Y</kbd>
                    </button>
                    <button type="button" id="ask-dont" data-key="n">
                        I don't <kbd>N</kbd>
                    </button>
                </div>
            </section>

            <!-- Teaching: read the meaning and example, type the missing word.
                 The meaning (word blanked) and a translated example are shown
                 up front as the prompt; the answer slot is below. -->
            <section id="teach-box" aria-labelledby="word-heading">
                <h2 id="word-heading">Type the word</h2>
                <div id="translation"></div>
                <p id="sentence" hidden></p>
                <p id="sentence-translation" hidden></p>
                <p id="word"></p>
                <input
                    id="answer-input"
                    type="text"
                    autocomplete="off"
                    autocapitalize="off"
                    autocorrect="off"
                    spellcheck="false"
                    aria-label="Type the word"
                />
                <p id="question"></p>
                <div id="answers">
                    <button type="button" data-response="n" data-key="n">
                        I don't know <kbd>N</kbd>
                    </button>
                    <button type="button" data-response="s" data-key="s">
                        Skip <kbd>S</kbd>
                    </button>
                </div>
                <p id="external-links">
                    <a id="google-link" target="_blank" rel="noopener noreferrer"
                        >Google Search</a
                    > ·
                    <a id="yandex-link" target="_blank" rel="noopener noreferrer"
                        >Yandex Translate</a
                    > ·
                    <a
                        id="wiktionary-link"
                        target="_blank"
                        rel="noopener noreferrer"
                        >Wiktionary</a
                    > ·
                    <a id="kaikki-link" target="_blank" rel="noopener noreferrer"
                        >Kaikki</a
                    >
                </p>
                <p id="continue-bar" hidden>
                    <button type="button" id="continue" data-key="enter">
                        Continue <kbd>Enter</kbd>
                    </button>
                </p>
            </section>

            <!-- Know: see the word, self-assess, then the meaning is shown. -->
            <section id="know-box" aria-labelledby="know-heading" hidden>
                <h2 id="know-heading">Do you know this word?</h2>
                <p id="know-word" class="word"></p>
                <p id="know-show-bar">
                    <button type="button" id="know-show" data-key=" ">
                        Show translation <kbd>Space</kbd>
                    </button>
                </p>
                <div id="know-answers">
                    <button type="button" data-response="y" data-key="y">
                        I know it <kbd>Y</kbd>
                    </button>
                    <button type="button" data-response="n" data-key="n">
                        I don't <kbd>N</kbd>
                    </button>
                </div>
                <div id="know-meaning" hidden></div>
                <p id="know-continue-bar" hidden>
                    <button type="button" id="know-continue" data-key="enter">
                        Continue <kbd>Enter</kbd>
                    </button>
                </p>
            </section>

            <!-- Choice: pick the right translation among several. -->
            <section id="choice-box" aria-labelledby="choice-heading" hidden>
                <h2 id="choice-heading">Choose the translation</h2>
                <p id="choice-word" class="word"></p>
                <div id="choice-options"></div>
                <p id="choice-continue-bar" hidden>
                    <button type="button" id="choice-continue" data-key="enter">
                        Continue <kbd>Enter</kbd>
                    </button>
                </p>
            </section>

            <!-- Connect: match several words with their translations. -->
            <section id="connect-box" aria-labelledby="connect-heading" hidden>
                <h2 id="connect-heading">Connect the words</h2>
                <div id="connect-grid">
                    <div id="connect-words" class="connect-column"></div>
                    <div
                        id="connect-translations"
                        class="connect-column"
                    ></div>
                </div>
                <p id="connect-continue-bar" hidden>
                    <button type="button" id="connect-continue" data-key="enter">
                        Continue <kbd>Enter</kbd>
                    </button>
                </p>
            </section>
        </main>
        <footer>
            <p id="status" role="status"></p>
            <p id="undo-bar" hidden>
                Last answered: <strong id="undo-word"></strong>
                <button type="button" id="undo">Undo</button>
            </p>
        </footer>
    </body>
</html>
