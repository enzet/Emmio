<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Emmio — Learn</title>
        <link rel="icon" href="/doc/icon.svg" type="image/svg+xml" />
        <link rel="stylesheet" href="style.css" />
        <script src="app.js" defer></script>
    </head>
    <body data-page="learn">
        <header>
            <a href="index" class="home">
                <img src="/doc/logo.svg" alt="Emmio" class="logo-corner" />
            </a>
            <nav>
                <a href="courses">← Courses</a>
            </nav>
            <a href="profile" class="profile-link">Profile</a>
        </header>
        <main>
            <h1 id="learn-heading">Learn</h1>

            <section aria-labelledby="word-heading">
                <h2 id="word-heading">Do you remember this word?</h2>
                <p id="word"></p>
                <p id="last-answer" hidden></p>
                <p id="sentence" hidden></p>
                <div id="answers">
                    <button type="button" data-response="y" data-key="y">
                        Right <kbd>Y</kbd>
                    </button>
                    <button type="button" data-response="n" data-key="n">
                        Wrong <kbd>N</kbd>
                    </button>
                    <button type="button" data-response="s" data-key="s">
                        Skip <kbd>S</kbd>
                    </button>
                </div>
                <p id="external-links">
                    <a id="google-link" target="_blank" rel="noopener noreferrer"
                        >Google</a
                    >
                    <a id="yandex-link" target="_blank" rel="noopener noreferrer"
                        >Yandex</a
                    >
                </p>
                <p id="translation-button">
                    <button type="button" id="show-translation" data-key=" ">
                        Show translation <kbd>Space</kbd>
                    </button>
                    <span id="no-translation" hidden>No translation found.</span>
                </p>
                <div id="translation"></div>
            </section>
        </main>
        <footer>
            <p id="status" role="status"></p>
            <p id="undo-bar" hidden>
                Last answered: <strong id="undo-word"></strong>
                <button type="button" id="undo">Undo</button>
            </p>
        </footer>
    </body>
</html>
