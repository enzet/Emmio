<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Emmio — Check lexicon</title>
        <script src="app.js" defer></script>
    </head>
    <body data-page="check">
        <header>
            <nav>
                <a href="lexicons.html">← Lexicons</a>
            </nav>
        </header>
        <main>
            <h1 id="lexicon-heading">Check lexicon</h1>

            <section aria-labelledby="word-heading">
                <h2 id="word-heading">Do you know this word?</h2>
                <p id="word"></p>
                <p>
                    <button type="button" id="show-translation">
                        Show translation
                    </button>
                </p>
                <div id="translation"></div>
                <div id="answers">
                    <button type="button" data-response="know">Know</button>
                    <button
                        type="button"
                        data-response="know"
                        data-skip="true"
                    >
                        Know and skip
                    </button>
                    <button type="button" data-response="dont">
                        Don't know
                    </button>
                    <button
                        type="button"
                        data-response="dont_but_proper_noun_too"
                    >
                        Proper noun
                    </button>
                    <button type="button" data-response="not_a_word">
                        Not a word
                    </button>
                </div>
            </section>

            <p id="status" role="status"></p>
        </main>
    </body>
</html>
