<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Emmio — Check lexicon</title>
        <link rel="icon" href="/doc/icon.svg" type="image/svg+xml" />
        <script src="theme.js"></script>
        <link rel="stylesheet" href="base.css" />
        <link rel="stylesheet" href="fancy.css" />
        <script src="app.js" defer></script>
    </head>
    <body data-page="check">
        <header>
            <a href="index" class="home">
                <img src="/doc/logo.svg" alt="Emmio" class="logo-corner" />
            </a>
            <nav>
                <a href="lexicons">← Lexicons</a>
                <span id="lexicon-heading">Check</span>
            </nav>
            <a href="profile" class="profile-link">Profile</a>
        </header>
        <main>

            <section aria-labelledby="word-heading">
                <p id="word"></p>
                <p id="sentence"></p>
                <p id="translation-button">
                    <button type="button" id="show-translation" data-key=" ">
                        Show translation <kbd>Space</kbd>
                    </button>
                    <span id="no-translation" hidden>No translation found.</span>
                </p>
                <div id="translation"></div>
            </section>
            <section>
                <p id="question"></p>
                <div id="answers">
                    <button type="button" data-response="know" data-key="y">
                        Know <kbd>Y</kbd>
                    </button>
                    <button
                        type="button"
                        data-response="know"
                        data-skip="true"
                        data-key="s"
                    >
                        Know and skip <kbd>S</kbd>
                    </button>
                    <button type="button" data-response="dont" data-key="n">
                        Don't know <kbd>N</kbd>
                    </button>
                    <button
                        type="button"
                        data-response="dont_but_proper_noun_too"
                        data-key="b"
                    >
                        Mostly not a word <kbd>B</kbd>
                    </button>
                    <button
                        type="button"
                        data-response="not_a_word"
                        data-key="-"
                    >
                        Not a word <kbd>-</kbd>
                    </button>
                </div>
                <p id="external-links">
                    <a id="google-link" target="_blank" rel="noopener noreferrer"
                        >Google Search</a
                    > ·
                    <a id="yandex-link" target="_blank" rel="noopener noreferrer"
                        >Yandex Translate</a
                    > ·
                    <a
                        id="wiktionary-link"
                        target="_blank"
                        rel="noopener noreferrer"
                        >Wiktionary</a
                    > ·
                    <a id="kaikki-link" target="_blank" rel="noopener noreferrer"
                        >Kaikki</a
                    >
                </p>
                <figure id="trajectory" hidden>
                    <svg
                        id="trajectory-svg"
                        role="img"
                        aria-label="Rate estimate trajectory over the answer history"
                    ></svg>
                    <div id="trajectory-tooltip" hidden></div>
                </figure>
            </section>
        </main>
        <footer>
            <div id="session-status">
                <span id="session-counts" hidden></span>
                <span id="rate-estimate" hidden></span>
                <span id="word-info" hidden></span>
            </div>
            <p id="status" role="status"></p>
            <p id="undo-bar" hidden>
                Last answered: <strong id="undo-word"></strong>
                <button type="button" id="undo">Undo</button>
            </p>
        </footer>
    </body>
</html>
