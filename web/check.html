<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Emmio — Check lexicon</title>
        <link rel="icon" href="/doc/icon.svg" type="image/svg+xml" />
        <link
            rel="preload"
            href="/data/fonts/InterVariable.woff2"
            as="font"
            type="font/woff2"
            crossorigin
        />
        <script src="theme.js"></script>
        <link rel="stylesheet" href="base.css" />
        <link rel="stylesheet" href="modern.css" />
        <script src="app.js" type="module"></script>
    </head>
    <body data-page="check">
        <header>
            <a href="index" class="home">
                <img src="/doc/logo.svg" alt="Emmio" class="logo-corner" />
            </a>
            <nav>
                <a href="lexicons">← Lexicons</a>
                <span id="lexicon-heading">Check</span>
            </nav>
            <a href="profile" class="profile-link">Profile</a>
        </header>
        <main class="check">

            <section aria-labelledby="word-heading">
                <p id="word"></p>
                <p id="sentence"></p>
                <p id="translation-button">
                    <button type="button" id="show-translation" data-key=" ">
                        <span id="show-translation-label">Show translation</span>
                        <kbd>Space</kbd>
                    </button>
                    <span id="no-translation" hidden>No translation found.</span>
                </p>
                <div id="translation"></div>
            </section>
            <section>
                <p id="question"></p>
                <div id="answers">
                    <button type="button" data-response="know" data-key="y">
                        Know <kbd>Y</kbd>
                    </button>
                    <button
                        type="button"
                        data-response="know"
                        data-skip="true"
                        data-key="s"
                    >
                        Know and skip <kbd>S</kbd>
                    </button>
                    <button
                        type="button"
                        data-response="know_semantic_class"
                        data-key="c"
                    >
                        Know class <kbd>C</kbd>
                    </button>
                    <button type="button" data-response="dont" data-key="n">
                        Don't know <kbd>N</kbd>
                    </button>
                    <button type="button" id="not-to-check" data-key="x">
                        Not to check <kbd>X</kbd>
                    </button>
                </div>
                <div id="not-to-check-categories" hidden>
                    <button
                        type="button"
                        data-response="not_a_word"
                        data-category="P"
                        data-key="p"
                    >
                        Proper noun <kbd>P</kbd>
                    </button>
                    <button
                        type="button"
                        data-response="not_a_word"
                        data-category="R"
                        data-key="r"
                    >
                        Rare/slang/retro word <kbd>R</kbd>
                    </button>
                    <button
                        type="button"
                        data-response="not_a_word"
                        data-category="M"
                        data-key="m"
                    >
                        Misspelling <kbd>M</kbd>
                    </button>
                    <button
                        type="button"
                        data-response="not_a_word"
                        data-category="S"
                        data-key="s"
                    >
                        Missing spaces <kbd>S</kbd>
                    </button>
                    <button
                        type="button"
                        data-response="not_a_word"
                        data-category="D"
                        data-key="d"
                    >
                        Missing diacritics <kbd>D</kbd>
                    </button>
                    <button
                        type="button"
                        data-response="not_a_word"
                        data-category="G"
                        data-key="g"
                    >
                        Split into fragments <kbd>G</kbd>
                    </button>
                    <button
                        type="button"
                        data-response="not_a_word"
                        data-category="F"
                        data-key="f"
                    >
                        Foreign word <kbd>F</kbd>
                    </button>
                    <button
                        type="button"
                        data-response="not_a_word"
                        data-category="N"
                        data-key="n"
                    >
                        Not a word <kbd>N</kbd>
                    </button>
                    <button type="button" id="not-to-check-back" data-key="z">
                        Back <kbd>Z</kbd>
                    </button>
                </div>
                <p id="external-links">
                    <a id="google-ai-link" target="_blank" rel="noopener noreferrer"
                        >Google AI</a
                    > ·
                    <a id="google-link" target="_blank" rel="noopener noreferrer"
                        >Google</a
                    > ·
                    <a id="yandex-link" target="_blank" rel="noopener noreferrer"
                        >Yandex Translate</a
                    > ·
                    <a
                        id="wiktionary-link"
                        target="_blank"
                        rel="noopener noreferrer"
                        >Wiktionary</a
                    > ·
                    <a id="kaikki-link" target="_blank" rel="noopener noreferrer"
                        >Kaikki</a
                    >
                </p>
                <figure id="trajectory" hidden>
                    <svg
                        id="trajectory-svg"
                        role="img"
                        aria-label="Rate estimate trajectory over the answer history"
                    ></svg>
                    <div id="trajectory-tooltip" hidden></div>
                </figure>
                <figure id="strata" hidden>
                    <svg
                        id="strata-svg"
                        viewBox="0 0 500 140"
                        role="img"
                        aria-label="Answered words by frequency stratum: one segment of a horizontal line per stratum, with a stack of dots per segment sized by its answer count, filled dots for known words, hollow for unknown"
                    ></svg>
                </figure>
            </section>
        </main>
        <footer>
            <div id="session-status">
                <span id="session-counts" hidden></span>
                <span id="rate-estimate" hidden></span>
                <span id="word-info" hidden></span>
            </div>
            <p id="status" role="status"></p>
            <p id="undo-bar" hidden>
                Last answered: <strong id="undo-word"></strong>
                <button type="button" id="undo">Undo</button>
            </p>
        </footer>
    </body>
</html>
