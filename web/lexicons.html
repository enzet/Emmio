<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Emmio — Lexicons</title>
        <link rel="icon" href="/doc/icon.svg" type="image/svg+xml" />
        <link
            rel="preload"
            href="/data/fonts/InterVariable.woff2"
            as="font"
            type="font/woff2"
            crossorigin
        />
        <script src="theme.js"></script>
        <link rel="stylesheet" href="base.css" />
        <link rel="stylesheet" href="modern.css" />
        <script src="app.js" type="module"></script>
    </head>
    <body data-page="lexicons">
        <header>
            <a href="index" class="home">
                <img src="/doc/logo.svg" alt="Emmio" class="logo-corner" />
            </a>
            <nav>
                <a href="lexicons">Lexicons</a>
                <a href="courses">Courses</a>
                <a href="curated-lists">Curated lists</a>
            </nav>
            <a href="profile" class="profile-link">Profile</a>
        </header>
        <main>
            <h1>Your lexicons</h1>
            <table id="lexicon-table" hidden>
                <thead>
                    <tr>
                        <th scope="col">Lexicon</th>
                        <th scope="col">Language</th>
                        <th scope="col">Selection</th>
                        <th scope="col">Rate</th>
                        <th scope="col">Words</th>
                    </tr>
                </thead>
                <tbody id="lexicon-rows"></tbody>
            </table>
            <p>
                <a href="new-lexicon" class="button">Add a lexicon</a>
            </p>
        </main>
        <footer>
            <p id="status" role="status">Loading…</p>
        </footer>
    </body>
</html>
