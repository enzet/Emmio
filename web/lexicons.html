<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Emmio — Lexicons</title>
        <script src="app.js" defer></script>
    </head>
    <body data-page="lexicons">
        <header>
            <nav>
                <a href="lexicons.html">Lexicons</a>
                <a href="courses.html">Courses</a>
                <button id="logout" type="button">Log out</button>
            </nav>
        </header>
        <main>
            <h1>Your lexicons</h1>
            <p id="status" role="status">Loading…</p>
            <table id="lexicon-table" hidden>
                <thead>
                    <tr>
                        <th scope="col">Lexicon</th>
                        <th scope="col">Language</th>
                        <th scope="col">Selection</th>
                        <th scope="col">Words</th>
                        <th scope="col">Don't know (7 days)</th>
                    </tr>
                </thead>
                <tbody id="lexicon-rows"></tbody>
            </table>
        </main>
    </body>
</html>
