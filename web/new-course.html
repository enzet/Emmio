<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Emmio — Add a course</title>
        <link rel="icon" href="/doc/icon.svg" type="image/svg+xml" />
        <link
            rel="preload"
            href="/data/fonts/InterVariable.woff2"
            as="font"
            type="font/woff2"
            crossorigin
        />
        <script src="theme.js"></script>
        <link rel="stylesheet" href="base.css" />
        <link rel="stylesheet" href="modern.css" />
        <script src="app.js" type="module"></script>
    </head>
    <body data-page="new-course">
        <header>
            <a href="index" class="home">
                <img src="/doc/logo.svg" alt="Emmio" class="logo-corner" />
            </a>
            <nav>
                <a href="courses">← Courses</a>
            </nav>
            <a href="profile" class="profile-link">Profile</a>
        </header>
        <main>
            <h1 id="add-course-heading">Add a course</h1>
            <p>
                A course is a language (e.g. Armenian) you're studying; add
                one or more learnings to it afterward (vocabulary, alphabet,
                …).
            </p>
            <form class="add-form" id="add-course-form" aria-labelledby="add-course-heading">
                <div class="field">
                    Subject
                    <select id="add-course-language" required></select>
                </div>
                <div class="field">
                    Name
                    <input
                        id="add-course-name"
                        class="course-name"
                        type="text"
                        placeholder="optional, defaults to the language name"
                    />
                </div>
                <button type="submit">Create course</button>
            </form>
            <p id="add-course-status" role="status"></p>
        </main>
    </body>
</html>
