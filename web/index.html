<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Emmio</title>
        <link rel="icon" href="/doc/icon.svg" type="image/svg+xml" />
        <link rel="stylesheet" href="style.css" />
        <script src="app.js" defer></script>
    </head>
    <body data-page="home">
        <header>
            <a href="index" class="home">
                <img src="/doc/logo.svg" alt="Emmio" class="logo-corner" />
            </a>
            <a href="profile" class="profile-link">Profile</a>
        </header>
        <main>
            <section id="welcome" aria-labelledby="welcome-heading" hidden>
                <h2 id="welcome-heading">Welcome to Emmio</h2>
                <p>
                    A lexicon tracks how much of a language's vocabulary you
                    know. You don't have one set as your main lexicon yet —
                    pick a language to create your first one.
                </p>
                <form id="create-lexicon-form">
                    <label for="new-lexicon-language">Language</label>
                    <select id="new-lexicon-language" required></select>
                    <label for="new-lexicon-targets">Translate into</label>
                    <select
                        id="new-lexicon-targets"
                        class="translation-languages"
                        multiple
                        required
                    ></select>
                    <button type="submit">Create lexicon</button>
                </form>
                <p id="create-status" role="status"></p>
            </section>

            <section id="languages" aria-labelledby="languages-heading" hidden>
                <h2 id="languages-heading">Languages</h2>
                <p id="languages-status" role="status"></p>
                <table id="languages-table" hidden>
                    <thead>
                        <tr>
                            <th scope="col">Language</th>
                            <th scope="col">Rate</th>
                            <th scope="col">Remaining</th>
                            <th scope="col"></th>
                        </tr>
                    </thead>
                    <tbody id="languages-rows"></tbody>
                </table>

                <h3 id="add-lexicon-heading">Add a lexicon</h3>
                <form id="add-lexicon-form">
                    <label for="add-lexicon-language">Language</label>
                    <select id="add-lexicon-language" required></select>
                    <label for="add-lexicon-targets">Translate into</label>
                    <select
                        id="add-lexicon-targets"
                        class="translation-languages"
                        multiple
                        required
                    ></select>
                    <button type="submit">Create lexicon</button>
                </form>
                <p id="add-status" role="status"></p>
            </section>
        </main>
    </body>
</html>
