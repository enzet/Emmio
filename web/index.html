<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Emmio</title>
        <link rel="icon" href="/doc/icon.svg" type="image/svg+xml" />
        <link rel="stylesheet" href="style.css" />
        <script src="app.js" defer></script>
    </head>
    <body data-page="home">
        <header>
            <a href="index.html" class="home">
                <img src="/doc/logo.svg" alt="Emmio" class="logo-corner" />
            </a>
            <button id="logout" type="button">Log out</button>
        </header>
        <main>
            <h1>Emmio</h1>
            <nav class="home-links">
                <a href="lexicons.html">Lexicons</a>
                <a href="courses.html">Courses</a>
            </nav>

            <section id="welcome" aria-labelledby="welcome-heading" hidden>
                <h2 id="welcome-heading">Welcome to Emmio</h2>
                <p>
                    A lexicon tracks how much of a language's vocabulary you
                    know. You don't have one set as your main lexicon yet —
                    pick a language to create your first one.
                </p>
                <form id="create-lexicon-form">
                    <label for="new-lexicon-language">Language</label>
                    <select id="new-lexicon-language" required></select>
                    <button type="submit">Create lexicon</button>
                </form>
                <p id="create-status" role="status"></p>
            </section>

            <section aria-labelledby="languages-heading">
                <h2 id="languages-heading">Languages</h2>
                <p id="languages-status" role="status"></p>
                <table id="languages-table" hidden>
                    <thead>
                        <tr>
                            <th scope="col">Language</th>
                            <th scope="col">Rate</th>
                            <th scope="col">Remaining</th>
                            <th scope="col"></th>
                        </tr>
                    </thead>
                    <tbody id="languages-rows"></tbody>
                </table>
            </section>
        </main>
    </body>
</html>
