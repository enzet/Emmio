<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Emmio — Courses</title>
        <link rel="icon" href="/doc/icon.svg" type="image/svg+xml" />
        <link rel="stylesheet" href="style.css" />
        <script src="app.js" defer></script>
    </head>
    <body data-page="courses">
        <header>
            <a href="index.html" class="home">
                <img src="/doc/logo.svg" alt="Emmio" class="logo-corner" />
            </a>
            <nav>
                <a href="lexicons.html">Lexicons</a>
                <a href="courses.html">Courses</a>
                <button id="logout" type="button">Log out</button>
            </nav>
        </header>
        <main>
            <h1>Your courses</h1>
            <p id="status" role="status">Loading…</p>
            <table id="course-table" hidden>
                <thead>
                    <tr>
                        <th scope="col">Course</th>
                        <th scope="col">Language</th>
                        <th scope="col">Words</th>
                        <th scope="col">Answers</th>
                    </tr>
                </thead>
                <tbody id="course-rows"></tbody>
            </table>
        </main>
    </body>
</html>
