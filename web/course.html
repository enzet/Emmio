<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Emmio — Course</title>
        <link rel="icon" href="/doc/icon.svg" type="image/svg+xml" />
        <link
            rel="preload"
            href="/data/fonts/InterVariable.woff2"
            as="font"
            type="font/woff2"
            crossorigin
        />
        <script src="theme.js"></script>
        <link rel="stylesheet" href="base.css" />
        <link rel="stylesheet" href="modern.css" />
        <script src="app.js" defer></script>
    </head>
    <body data-page="course">
        <header>
            <a href="index" class="home">
                <img src="/doc/logo.svg" alt="Emmio" class="logo-corner" />
            </a>
            <nav>
                <a href="courses">← Courses</a>
            </nav>
            <a href="profile" class="profile-link">Profile</a>
        </header>
        <main>
            <h1 id="course-heading">Course</h1>

            <table id="learning-table" hidden>
                <thead>
                    <tr>
                        <th scope="col">Learning</th>
                        <th scope="col">Type</th>
                        <th scope="col">Words</th>
                        <th scope="col">Answers</th>
                    </tr>
                </thead>
                <tbody id="learning-rows"></tbody>
            </table>
            <p>
                <a id="add-learning-link" href="#" class="button"
                    >+ Add a learning</a
                >
            </p>

            <section id="settings-section" hidden>
                <h2>Settings</h2>
                <form id="settings-form">
                    <label for="setting-name">Name</label>
                    <input id="setting-name" type="text" required />
                    <button type="submit">Save settings</button>
                </form>
                <p id="settings-status" role="status"></p>
            </section>

            <section id="danger" hidden>
                <button id="delete-course" type="button" class="danger">
                    Delete course
                </button>
                <p id="delete-status" role="status"></p>
            </section>
        </main>
        <footer>
            <p id="status" role="status">Loading…</p>
        </footer>
    </body>
</html>
