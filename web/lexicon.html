<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Emmio — Lexicon</title>
        <link rel="icon" href="/doc/icon.svg" type="image/svg+xml" />
        <script src="theme.js"></script>
        <link rel="stylesheet" href="base.css" />
        <link rel="stylesheet" href="fancy.css" />
        <script src="app.js" defer></script>
    </head>
    <body data-page="lexicon">
        <header>
            <a href="index" class="home">
                <img src="/doc/logo.svg" alt="Emmio" class="logo-corner" />
            </a>
            <nav>
                <a href="lexicons">← Lexicons</a>
            </nav>
            <a href="profile" class="profile-link">Profile</a>
        </header>
        <main>
            <h1 id="lexicon-heading">Lexicon</h1>
            <p>
                <a id="check-link" href="#">Check this lexicon</a>
            </p>
            <p>
                <button id="main-toggle" type="button" hidden></button>
            </p>
            <dl id="stats"></dl>

            <section id="settings-section" hidden>
                <h2>Settings</h2>
                <form id="settings-form">
                    <label for="setting-name">Name (optional)</label>
                    <input
                        id="setting-name"
                        type="text"
                        maxlength="100"
                        placeholder="e.g. German (books)"
                    />
                    <label for="setting-id">Identifier</label>
                    <input
                        id="setting-id"
                        type="text"
                        pattern="[a-z0-9][a-z0-9_\-]{0,63}"
                        maxlength="64"
                        required
                        title="Lowercase letters, digits, `_`, and `-`."
                    />
                    <p class="hint">
                        The identifier is used in links; changing it changes
                        this page's address.
                    </p>
                    <label for="setting-targets">Translate into</label>
                    <select
                        id="setting-targets"
                        class="translation-languages"
                        multiple
                        required
                    ></select>
                    <label for="setting-precision">
                        Weekly goal (answers per week)
                    </label>
                    <input
                        id="setting-precision"
                        type="number"
                        min="0"
                        required
                    />
                    <button type="submit">Save settings</button>
                </form>
                <p id="settings-status" role="status"></p>
            </section>

            <section id="danger" hidden>
                <button id="delete-lexicon" type="button" class="danger">
                    Delete lexicon
                </button>
                <p id="delete-status" role="status"></p>
            </section>
        </main>
        <footer>
            <p id="status" role="status">Loading…</p>
        </footer>
    </body>
</html>
