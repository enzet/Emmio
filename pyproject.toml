[build-system]
requires = ["setuptools>=75.8.0"]
build-backend = "setuptools.build_meta"

[project]
name = "Emmio"
version = "0.1"
description = "Language learning toolbox"
authors = [
    { name = "Sergey Vartanov", email = "me@enzet.ru" }
]
license = { text = "" }
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "PyYAML~=6.0.2",
    "beartype~=0.20.0",
    "colour~=0.1.5",
    "googletrans~=4.0.2",
    "iso639-lang~=2.5.1",
    "matplotlib~=3.10.0",
    "mpv~=1.0.7",
    "numpy~=2.2.3",
    "psycopg[binary]~=3.2",
    "scipy~=1.15.0",
    "pyTelegramBotAPI~=4.26.0",
    "pydantic~=2.10.6",
    "python-mpv~=1.0.7",
    "readchar~=4.2.1",
    "rich~=13.9.4",
    "svgwrite~=1.4.3",
    "tqdm~=4.67.1",
    "urllib3~=2.3.0",
]

[project.optional-dependencies]
dev = [
    "black~=24.4.2",
    "isort~=6.0.1",
    "mypy~=1.15.0",
    "pylint~=3.3.5",
    "pytest~=8.3.4",
    "httpx~=0.28.0",  # FastAPI test client.
]
api = [
    "fastapi~=0.115.0",
    "uvicorn~=0.34.0",
    "pyjwt~=2.10.0",  # Signing and verifying access tokens.
    "bcrypt~=4.2.0",  # Password hashing.
    "python-multipart~=0.0.18",  # OAuth2 login form parsing.
]

[project.urls]
Homepage = "https://github.com/enzet/Emmio"

[project.scripts]
emmio = "emmio.__main__:main"

[tool.setuptools]
packages = ["emmio"]

[tool.black]
line-length = 80
skip-magic-trailing-comma = true

[tool.isort]
profile = "black"

[tool.mypy]
python_version = "3.12"
disable_error_code = ["import-untyped"]
disallow_untyped_defs = true  # Report functions without type annotations.
disallow_untyped_decorators = true  # Ensure decorators have types.
warn_return_any = true  # Warn if return type is inferred as `Any`.

[tool.pylint]
py-version = "3.12"
disable = [
    "E0401",  # Import error (Pylint usually fails to track imports correctly).
    "C0302",  # Too many lines in module.
    "C0415",  # Import outside toplevel.
    "R0902",  # Too many instance attributes.
    "R0903",  # Too few public methods.
    "R0904",  # Too many public methods.
    "R0911",  # Too many return statements.
    "R0912",  # Too many branches.
    "R0913",  # Too many arguments in function.
    "R0914",  # Too many local variables.
    "R0915",  # Too many statements.
    "R0917",  # Too many positional arguments.
    "R0801",  # Similar lines across files (noisy for load/save symmetry).
]

[tool.pylint.typecheck]
# Pylint cannot introspect psycopg's C-extension types and reports false
# `no-member` errors for `Connection.cursor`, `Connection.commit`, etc.
ignored-modules = ["psycopg"]

[tool.ruff]
lint.select = ["ALL"]
lint.ignore = [
    "ANN401",  # `Any` in *args/**kwargs is sometimes necessary.
    "C901",    # Too complex functions are allowed.
    "COM812",  # Trailing comma not in Black style.
    "D105",    # Missing docstring in magic method is allowed.
    "D107",    # Missing docstring in `__init__` method is allowed.
    "D202",    # No blank line after function docstring is allowed.
    "D203",    # Blank line is not required before class docstring.
    "D213",    # New line after """ is not needed.
    "FIX002",  # Todo markers are allowed.
    "INP001",  # Implicit namespace packages are acceptable.
    "PGH003",  # Bare type: ignore is used where specific codes are unclear.
    "PLR0911", # Too many return statements are allowed.
    "PLR0912", # Too many branches are allowed.
    "PLR0913", # Too many arguments are allowed.
    "PLR0915", # Too many statements are allowed.
    "PLR2004", # Magic values are sometimes more readable than named constants.
    "RUF001",  # Ambiguous symbols are allowed.
    "RUF002",  # Ambiguous symbols are allowed.
    "S101",    # Asserts are allowed in tests.
    "S311",    # Standard random is appropriate for non-cryptographic use.
    "S324",    # MD5 is used for non-security file caching.
    "S506",    # YAML FullLoader is intentional.
    "TC001",   # We use beartype.
    "TC003",   # We use beartype.
    "TD003",   # Issues for todos are not required.
]
line-length = 80
